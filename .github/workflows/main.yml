name: Build PrivPracAC

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build plugin
        run: mvn -B package --file PrivPracAC/pom.xml

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: PrivPracAC-jar
          path: PrivPracAC/target/*.jar
